{% extends 'auth_base.html' %}
{% block title %}Sign in · UJL Plan Control Center{% endblock %}
{% block form %}
<form method="post" class="form">
  {{ csrf_input() }}
  <label>Username<input name="username" required autofocus autocomplete="username" maxlength="64"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password" maxlength="200"></label>
  <button class="btn" type="submit">Sign in</button>
</form>
<p class="mute">No account yet? <a href="{{ url_for('auth.register') }}">Request access</a>. A Super User approves each request.</p>
{% endblock %}
